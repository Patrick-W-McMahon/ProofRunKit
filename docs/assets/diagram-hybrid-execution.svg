    <text x="28" y="56" fill="#A3B0C2" font-family="Liberation Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">The kit shells out to real compilers and runtimes, captures what they do, and records a verdict. Nothing here is in-process compilation.</text>
