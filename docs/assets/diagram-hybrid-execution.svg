<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid execution model (planned)</title>
  <desc id="desc">Compiled languages shell out to gcc, clang, MSVC cl, dotnet, javac, rustc, cargo, go, or assemblers; diagnostics, exit codes, and outputs are captured, then produced binaries are run. Script suites run on node, tsc, or python. The kit records a verdict.</desc>
