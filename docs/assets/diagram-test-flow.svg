<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">How ProofRunKit runs tests (planned)</title>
  <desc id="desc">Authors write Lua or JavaScript tests on disk. The single proofrunkit.exe loads and runs them and reports results. The executable does not change when tests change.</desc>
  <defs>
    <pattern id="dotgrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="#3EE0C8" opacity="0.08"/>
    </pattern>
    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="420" rx="16" ry="16"/>
    </clipPath>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 1.5 L 10 6 L 0 10.5 Z" fill="#3EE0C8"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 1.5 L 10 6 L 0 10.5 Z" fill="#A3B0C2"/>
    </marker>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A2740" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#3EE0C8" stop-opacity="0.06"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="#0B1220"/>
    <rect width="1200" height="420" fill="url(#dotgrid)"/>
    <rect width="1200" height="420" fill="url(#sheen)"/>
    <rect x="0" y="414" width="1200" height="6" fill="#3EE0C8"/>
    <rect x="0" y="0" width="1200" height="72" fill="#0A101A"/>
    <rect x="0" y="0" width="6" height="72" fill="#3EE0C8"/>
    <text x="28" y="34" fill="#F4F7FB" font-family="Liberation Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">How tests are run (planned)</text>
    <text x="28" y="56" fill="#A3B0C2" font-family="Liberation Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Authors write Lua or JavaScript tests. One compiled executable loads them at runtime and reports results.</text>
    <rect x="36" y="160" width="190" height="132" rx="14" ry="14" fill="#141C2E" stroke="#33415C" stroke-width="1.25"/>
    <text x="131.0" y="211.0" fill="#F4F7FB" font-family="Liberation Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Authors</text>
    <text x="131.0" y="231.0" fill="#A3B0C2" font-family="Liberation Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">Write tests in</text>
    <text x="131.0" y="251.0" fill="#A3B0C2" font-family="Liberation Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">Lua or JS tests</text>
    <rect x="300" y="160" width="180" height="58" rx="14" ry="14" fill="#141C2E" stroke="#33415C" stroke-width="1.25"/>
    <text x="390.0" y="195.0" fill="#F4F7FB" font-family="Liberation Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">tests.lua</text>
    <rect x="300" y="234" width="180" height="58" rx="14" ry="14" fill="#141C2E" stroke="#33415C" stroke-width="1.25"/>
    <text x="390.0" y="269.0" fill="#F4F7FB" font-family="Liberation Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">tests.js</text>
    <rect x="554" y="152" width="310" height="148" rx="14" ry="14" fill="#1A2438" stroke="#3EE0C8" stroke-width="2"/>
    <text x="709.0" y="211.0" fill="#F4F7FB" font-family="Liberation Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">proofrunkit.exe</text>
    <text x="709.0" y="231.0" fill="#A3B0C2" font-family="Liberation Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">Single stable binary</text>
    <text x="709.0" y="251.0" fill="#A3B0C2" font-family="Liberation Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">Loads tests at runtime</text>
    <rect x="938" y="160" width="226" height="132" rx="14" ry="14" fill="#141C2E" stroke="#33415C" stroke-width="1.25"/>
    <text x="1051.0" y="211.0" fill="#F4F7FB" font-family="Liberation Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Results</text>
    <text x="1051.0" y="231.0" fill="#A3B0C2" font-family="Liberation Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">Console · JSON</text>
    <text x="1051.0" y="251.0" fill="#A3B0C2" font-family="Liberation Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">JUnit XML</text>
    <line x1="232" y1="226.0" x2="292" y2="226.0" stroke="#3EE0C8" stroke-width="1.75" marker-end="url(#arrow)"/>
    <text x="262.0" y="216.0" fill="#A3B0C2" font-family="Liberation Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">write</text>
    <line x1="486" y1="226.0" x2="546" y2="226.0" stroke="#3EE0C8" stroke-width="1.75" marker-end="url(#arrow)"/>
    <text x="516.0" y="216.0" fill="#A3B0C2" font-family="Liberation Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">load &amp; run</text>
    <line x1="870" y1="226.0" x2="930" y2="226.0" stroke="#3EE0C8" stroke-width="1.75" marker-end="url(#arrow)"/>
    <text x="900.0" y="216.0" fill="#A3B0C2" font-family="Liberation Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">report</text>
    <text x="600.0" y="394" fill="#A3B0C2" font-family="Liberation Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">The executable is compiled once. Tests stay on disk and are never built into the binary.</text>
  </g>
</svg>
