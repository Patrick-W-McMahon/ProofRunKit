<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">ProofRunKit</title>
  <desc id="desc">ProofRunKit — a single high-performance test executable, compiled once. Tests change; the binary stays put.</desc>
  <defs>
    <pattern id="dotgrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="#3EE0C8" opacity="0.08"/>
    </pattern>
    <clipPath id="frame">
      <rect x="0" y="0" width="1280" height="320" rx="16" ry="16"/>
    </clipPath>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 1.5 L 10 6 L 0 10.5 Z" fill="#3EE0C8"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 1.5 L 10 6 L 0 10.5 Z" fill="#A3B0C2"/>
    </marker>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A2740" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#3EE0C8" stop-opacity="0.06"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="#0B1220"/>
    <rect width="1280" height="320" fill="url(#dotgrid)"/>
    <rect width="1280" height="320" fill="url(#sheen)"/>
    <rect x="0" y="314" width="1280" height="6" fill="#3EE0C8"/>
    <text x="1248" y="230" fill="#3EE0C8" fill-opacity="0.06" font-family="Liberation Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="200" font-weight="700" text-anchor="end">PRK</text>
    <rect x="56" y="96" width="128" height="128" rx="28" ry="28" fill="#101827" stroke="#3EE0C8" stroke-width="2.5"/>
    <rect x="78" y="122" width="40" height="50" rx="7" ry="7" fill="#1A2438" stroke="#A3B0C2" stroke-width="1.4"/>
    <line x1="86" y1="136" x2="110" y2="136" stroke="#A3B0C2" stroke-width="2" stroke-linecap="round"/>
    <line x1="86" y1="146" x2="106" y2="146" stroke="#A3B0C2" stroke-width="2" stroke-linecap="round"/>
    <line x1="86" y1="156" x2="110" y2="156" stroke="#A3B0C2" stroke-width="2" stroke-linecap="round"/>
    <rect x="122" y="132" width="40" height="50" rx="7" ry="7" fill="#1A2438" stroke="#E8C36A" stroke-width="1.4"/>
    <line x1="130" y1="146" x2="154" y2="146" stroke="#E8C36A" stroke-width="2" stroke-linecap="round"/>
    <line x1="130" y1="156" x2="150" y2="156" stroke="#E8C36A" stroke-width="2" stroke-linecap="round"/>
    <line x1="130" y1="166" x2="154" y2="166" stroke="#E8C36A" stroke-width="2" stroke-linecap="round"/>
    <rect x="78" y="192" width="84" height="14" rx="7" ry="7" fill="#3EE0C8" stroke="#3EE0C8" stroke-width="0"/>
    <text x="216" y="155" font-family="Liberation Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" text-anchor="start"><tspan fill="#F4F7FB" font-weight="700">Proof</tspan><tspan fill="#3EE0C8" font-weight="700">Run</tspan><tspan fill="#F4F7FB" font-weight="700">Kit</tspan></text>
    <text x="216" y="200" fill="#A3B0C2" font-family="Liberation Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">A single high-performance test executable.</text>
    <text x="216" y="232" fill="#F4F7FB" font-family="Liberation Sans, DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="start">Compiled once. Tests change. The binary doesn&#x27;t.</text>
  </g>
</svg>
