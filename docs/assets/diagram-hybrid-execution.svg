<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid execution model (planned)</title>
  <desc id="desc">Compiled languages shell out to gcc, clang, MSVC cl, dotnet, or assemblers; diagnostics, exit codes, and outputs are captured, then produced binaries are run. Script suites run on node or python. The kit records a verdict.</desc>
  <defs>
    <pattern id="dotgrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="#3EE0C8" opacity="0.08"/>
    </pattern>
    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="800" rx="16" ry="16"/>
    </clipPath>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 1.5 L 10 6 L 0 10.5 Z" fill="#3EE0C8"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 1.5 L 10 6 L 0 10.5 Z" fill="#A3B0C2"/>
    </marker>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A2740" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#3EE0C8" stop-opacity="0.06"/>
    </linearGradient>
  </defs>
